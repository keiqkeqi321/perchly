<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>休息一下</title>
    <link rel="stylesheet" href="/src/styles/break.css" />
  </head>
  <body class="theme-micro">
    <main class="overlay" id="overlay">
      <!-- 顶部小标签：当前休息类型 -->
      <div class="kind-badge" id="kind-badge">微休息</div>

      <!-- 居中倒计时：SVG 圆环 + mm:ss -->
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
          <!-- 底环（静态轨道） -->
          <circle class="ring-track" cx="130" cy="130" r="118" />
          <!-- 进度环：stroke-dashoffset 由 JS 驱动 -->
          <circle class="ring-progress" id="ring-progress" cx="130" cy="130" r="118" />
        </svg>
        <div class="ring-center">
          <div class="countdown" id="countdown">--:--</div>
          <div class="countdown-hint">剩余时间</div>
        </div>
      </div>

      <!-- 随机休息提示文案（JS 注入） -->
      <div class="tip" id="tip"></div>

      <!-- 底部按钮：严格模式下不渲染（JS 决定） -->
      <div class="actions" id="actions">
        <button type="button" class="btn" id="btn-postpone">推迟</button>
        <button type="button" class="btn btn-skip" id="btn-skip">跳过</button>
      </div>

      <!-- 键盘提示（严格模式下隐藏） -->
      <div class="kbd-hint" id="kbd-hint">Esc / Ctrl+C 跳过</div>
    </main>

    <script type="module" src="/src/break.ts"></script>
  </body>
</html>
